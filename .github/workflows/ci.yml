name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browser tests against the built site (e2e/) on Chromium, Firefox, WebKit and phone emulation (hq t045). Written by an AI agent (Claude).
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          E2E_ALL_BROWSERS: '1'
